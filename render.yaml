# Render setup for Study Notebook (Render: New > Blueprint > pick this repository).
# Secrets are NOT stored here: Render asks for DATABASE_URL on its own screen.
# Anyone with the link can open the notebook. To ask for an access code instead,
# add REQUIRE_LOGIN=true and APP_PASSWORD in Render's Environment settings.
services:
  - type: web
    name: study-notebook
    runtime: node
    plan: free
    region: ohio            # same area as the Neon database (US East), so pages load faster
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false         # paste the Neon connection string on Render's screen
      - key: SESSION_SECRET
        generateValue: true # only used if you turn sign-in on
